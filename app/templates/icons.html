{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{% if name=='camera' %}<rect x="3" y="5" width="13" height="14" rx="3"/><path d="m16 10 5-3v10l-5-3"/>{% elif name=='history' %}<path d="M3 11a9 9 0 1 1 2 7M3 4v7h7m2-4v5l3 2"/>{% elif name=='sound' %}<path d="M11 4 6 8H3v8h3l5 4zM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>{% elif name=='muted' %}<path d="M11 4 6 8H3v8h3l5 4zM16 9l5 6m0-6-5 6"/>{% elif name=='expand' %}<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>{% elif name=='grid' %}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>{% elif name=='single' %}<rect x="3" y="3" width="18" height="18" rx="2"/>{% elif name=='auto' %}<path d="M3 3h18v18H3zM9 3v18m6-18v18M3 9h18M3 15h18"/>{% elif name=='play' %}<path d="m8 4 12 8-12 8z"/>{% elif name=='pause' %}<path d="M8 4v16M16 4v16"/>{% elif name=='back' %}<path d="m15 5-7 7 7 7"/>{% elif name=='next' %}<path d="m9 5 7 7-7 7"/>{% elif name=='download' %}<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>{% elif name=='snapshot' %}<path d="M8 5 9 3h6l1 2h5v15H3V5z"/><circle cx="12" cy="12" r="4"/>{% elif name=='info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>{% elif name=='close' %}<path d="m5 5 14 14M5 19 19 5"/>{% elif name=='center' %}<circle cx="12" cy="12" r="5"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/>{% elif name=='calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>{% elif name=='minus' %}<path d="M5 12h14"/>{% elif name=='plus' %}<path d="M5 12h14M12 5v14"/>{% elif name=='pan' %}<path d="M12 3v18M3 12h18m-3-3 3 3-3 3M6 9l-3 3 3 3m6-9 3-3 3 3m-6 12 3 3 3-3"/>{% else %}<circle cx="12" cy="12" r="9"/><path d="M9 8a3 3 0 1 1 4 3c-1 1-1 2-1 3m0 3v.1"/>{% endif %}</svg>
{%- endmacro %}
{% macro button(id,name,label,cls='icon-button') -%}<button type="button" id="{{ id }}" class="{{ cls }}" aria-label="{{ label }}" title="{{ label }}">{{ icon(name) }}</button>{%- endmacro %}
